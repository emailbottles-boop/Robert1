<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robert's Website</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: url('/image-1777877237158.jpg');
      background-size: cover;
      background-position: center 20%;
      filter: brightness(0.45) saturate(0.7);
      transform: scale(1.05);
      z-index: 0;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(60,0,0,0.55) 0%, rgba(5,0,0,0.82) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(28px, 6vh, 52px);
      width: 100%;
      padding: 0 20px;
    }

    .title-block {
      text-align: center;
    }

    .welcome-sub {
      font-size: clamp(0.6rem, 1.8vw, 0.72rem);
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(220, 80, 80, 0.65);
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #fff;
      text-shadow: 0 0 60px rgba(180, 20, 20, 0.8);
      line-height: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 2vw, 16px);
      width: 100%;
      max-width: 440px;
    }

    .card {
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card:hover,
    .card:active { transform: scale(0.96); }

    .music {
      background: rgba(160, 70, 0, 0.45);
      border: 1px solid rgba(220, 120, 30, 0.35);
      box-shadow: 0 8px 32px rgba(140, 60, 0, 0.5);
    }

    .photo {
      background: rgba(120, 10, 10, 0.5);
      border: 1px solid rgba(200, 40, 40, 0.35);
      box-shadow: 0 8px 32px rgba(140, 10, 10, 0.55);
    }

    .drug {
      background: rgba(10, 90, 45, 0.45);
      border: 1px solid rgba(40, 180, 90, 0.3);
      box-shadow: 0 8px 32px rgba(10, 100, 50, 0.45);
    }

    .web {
      background: rgba(10, 50, 110, 0.45);
      border: 1px solid rgba(40, 130, 210, 0.3);
      box-shadow: 0 8px 32px rgba(10, 60, 140, 0.45);
    }

    .card-icon {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 8px;
      line-height: 1;
    }

    .label {
      font-size: clamp(0.85rem, 2.8vw, 1.15rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .sub {
      font-size: clamp(0.5rem, 1.2vw, 0.62rem);
      font-weight: 300;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="bg-overlay"></div>

  <div class="content">

    <div class="title-block">
      <p class="welcome-sub">Welcome to</p>
      <h1>Robert's Website</h1>
    </div>

    <div class="grid">

      <a class="card music" href="/music">
        <div class="card-icon">🎵</div>
        <div class="label">Two Bottles<br>Music</div>
        <div class="sub">Stream & Listen</div>
      </a>

      <a class="card photo" href="/photography">
        <div class="card-icon">📷</div>
        <div class="label">Photography</div>
        <div class="sub">Portfolio</div>
      </a>

      <a class="card drug" href="/harmreduction">
        <div class="card-icon">🧪</div>
        <div class="label">Harm Reduction</div>
        <div class="sub">Resources & Tools</div>
      </a>

      <a class="card web" href="/web-dev">
        <div class="card-icon">💻</div>
        <div class="label">Web Dev</div>
        <div class="sub">Projects & Work</div>
      </a>

    </div>

  </div>

</body>
</html>
