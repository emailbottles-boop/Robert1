<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Bottles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0d0d0d;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .card {
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover,
    .card:active { transform: scale(0.97); }

    .music { background: linear-gradient(150deg, #e8a020, #b86800); box-shadow: 0 8px 40px rgba(184,104,0,0.5); }
    .photo { background: linear-gradient(150deg, #e05c30, #a82a0a); box-shadow: 0 8px 40px rgba(168,42,10,0.5); }
    .drug  { background: linear-gradient(150deg, #2db86a, #0e7a3e); box-shadow: 0 8px 40px rgba(14,122,62,0.5); }
    .web   { background: linear-gradient(150deg, #2898d8, #0a5ea8); box-shadow: 0 8px 40px rgba(10,94,168,0.5); }

    .label {
      font-size: clamp(1.1rem, 4vw, 2.1rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      letter-spacing: -0.03em;
      text-align: center;
    }

    .sub {
      font-size: clamp(0.6rem, 1.6vw, 0.78rem);
      font-weight: 300;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 6px;
      text-align: center;
    }

    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.2);
      color: rgba(255,255,255,0.5);
      font-size: clamp(0.48rem, 1.2vw, 0.6rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <a class="card music" href="/music">

    <div class="label">Two Bottles<br>Music</div>
    <div class="sub">Stream &amp; Listen</div>
  </a>

  <div class="card photo">
    <span class="badge">Coming Soon</span>

    <div class="label">Photo&shy;graphy</div>
    <div class="sub">Portfolio</div>
  </div>

  <div class="card drug">
    <span class="badge">Coming Soon</span>

    <div class="label">Drug Testing</div>
    <div class="sub">Harm Reduction</div>
  </div>

  <div class="card web">
    <span class="badge">Coming Soon</span>

    <div class="label">Web Dev</div>
    <div class="sub">Projects &amp; Work</div>
  </div>

</body>
</html>
