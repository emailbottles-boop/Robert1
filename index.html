<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robert's Website</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #080306;
      color: #fff;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .photo-wrap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(340px, 80vw);
      height: 52%;
      z-index: 0;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
      border-radius: 0 0 20px 20px;
    }

    .photo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0 0 20px 20px;
      background: linear-gradient(
        to bottom,
        transparent 30%,
        rgba(8,3,6,0.7) 70%,
        #080306 100%
      );
    }

    .photo-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0 0 20px 20px;
      background: linear-gradient(
        to right,
        rgba(8,3,6,0.5) 0%,
        transparent 20%,
        transparent 80%,
        rgba(8,3,6,0.5) 100%
      );
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      padding: 0 20px 28px;
      gap: 20px;
    }

    .title-block {
      text-align: center;
    }

    .welcome-sub {
      font-size: clamp(0.55rem, 1.6vw, 0.68rem);
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(220, 80, 80, 0.6);
      margin-bottom: 4px;
    }

    h1 {
      font-size: clamp(1.9rem, 6.5vw, 3.4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #fff;
      text-shadow: 0 0 50px rgba(160, 15, 15, 0.9);
      line-height: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 2vw, 14px);
      width: 100%;
      max-width: 420px;
    }

    .card {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 16px;
    }

    .card:hover,
    .card:active { transform: scale(0.96); }

    .music {
      background: linear-gradient(150deg, #c47a10, #7a4200);
      box-shadow: 0 6px 28px rgba(140, 70, 0, 0.45);
    }

    .photo {
      background: linear-gradient(150deg, #9e1a0a, #5a0805);
      box-shadow: 0 6px 28px rgba(130, 15, 10, 0.5);
    }

    .drug {
      background: linear-gradient(150deg, #1e9454, #0a5230);
      box-shadow: 0 6px 28px rgba(10, 90, 50, 0.45);
    }

    .web {
      background: linear-gradient(150deg, #1860a8, #0a3a70);
      box-shadow: 0 6px 28px rgba(10, 55, 130, 0.45);
    }

    .label {
      font-size: clamp(0.88rem, 2.8vw, 1.1rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .sub {
      font-size: clamp(0.5rem, 1.2vw, 0.6rem);
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="photo-wrap">
    <img src="/image-1777877237158.jpg" alt="Robert" />
  </div>

  <div class="content">
    <div class="title-block">
      <p class="welcome-sub">Welcome to</p>
      <h1>Robert's Website</h1>
    </div>

    <div class="grid">

      <a class="card music" href="/music">
        <div class="label">Two Bottles<br>Music</div>
        <div class="sub">Stream & Listen</div>
      </a>

      <a class="card photo" href="/photography">
        <div class="label">Barter Fair<br>2026</div>
        <div class="sub">Photography</div>
      </a>

      <a class="card drug" href="/harmreduction">
        <div class="label">Harm Reduction</div>
        <div class="sub">Resources & Tools</div>
      </a>

      <a class="card web" href="/web-dev">
        <div class="label">Robert's<br>Websites</div>
        <div class="sub">Projects & Work</div>
      </a>

    </div>
  </div>

  <div style="position:fixed; top:32%; left:50%; transform:translateX(-50%); text-align:center; font-family:'Outfit',sans-serif; z-index:10; white-space:nowrap;">
    <div style="font-size:0.62rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:3px;">Reach Out</div>
    <div style="font-size:1.3rem; font-weight:900; color:#fff; letter-spacing:0.04em; text-shadow:0 2px 12px rgba(0,0,0,0.8);">253-486-4298</div>
  </div>

</body>
</html>
