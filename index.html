<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Bottles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #111008;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .card {
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover,
    .card:active { transform: scale(0.97); }

    .music { background: linear-gradient(135deg, #e8a020, #b86800); box-shadow: 0 8px 40px rgba(184,104,0,0.5); }
    .photo { background: linear-gradient(135deg, #e05c30, #a82a0a); box-shadow: 0 8px 40px rgba(168,42,10,0.5); }
    .drug  { background: linear-gradient(135deg, #2db86a, #0e7a3e); box-shadow: 0 8px 40px rgba(14,122,62,0.5); }
    .web   { background: linear-gradient(135deg, #2898d8, #0a5ea8); box-shadow: 0 8px 40px rgba(10,94,168,0.5); }

    .icon {
      font-size: clamp(2rem, 6vw, 3.5rem);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
    }

    .label {
      font-size: clamp(1rem, 4vw, 1.9rem);
      font-weight: 700;
      color: #111;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .sub {
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.15);
      color: rgba(0,0,0,0.45);
      font-size: clamp(0.5rem, 1.5vw, 0.65rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <a class="card music" href="/music">
    <div class="icon">🎵</div>
    <div class="label">Two Bottles<br>Music</div>
    <div class="sub">Stream &amp; Listen</div>
  </a>

  <div class="card photo">
    <span class="badge">Coming Soon</span>
    <div class="icon">📷</div>
    <div class="label">Photography</div>
    <div class="sub">Portfolio</div>
  </div>

  <div class="card drug">
    <span class="badge">Coming Soon</span>
    <div class="icon">🧪</div>
    <div class="label">Drug Testing</div>
    <div class="sub">Harm Reduction</div>
  </div>

  <div class="card web">
    <span class="badge">Coming Soon</span>
    <div class="icon">💻</div>
    <div class="label">Web Dev</div>
    <div class="sub">Projects &amp; Work</div>
  </div>

</body>
</html>
