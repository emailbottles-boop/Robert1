<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robert's Website</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0608;
      color: #fff;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    /* ── Hero photo ── */
    .hero {
      position: relative;
      flex: 0 0 44%;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(180,30,30,0.35);
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
        rgba(10,4,6,0.88) 0%,
        rgba(100,10,10,0.15) 50%,
        transparent 100%);
    }

    .hero-text {
      position: absolute;
      bottom: 20px;
      left: 22px;
    }

    .welcome-sub {
      font-size: clamp(0.6rem, 1.8vw, 0.72rem);
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,100,100,0.7);
      margin-bottom: 5px;
    }

    h1 {
      font-size: clamp(1.7rem, 6.5vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(200,40,40,0.6);
    }

    /* ── Card grid ── */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      min-height: 0;
    }

    .card {
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 28px);
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover,
    .card:active { transform: scale(0.97); }

    .music { background: linear-gradient(150deg, #e8a020, #9a5500); box-shadow: 0 8px 32px rgba(184,104,0,0.4); }
    .photo { background: linear-gradient(150deg, #cc3318, #7a1008); box-shadow: 0 8px 32px rgba(180,30,20,0.5); }
    .drug  { background: linear-gradient(150deg, #2db86a, #0a5c30); box-shadow: 0 8px 32px rgba(14,122,62,0.4); }
    .web   { background: linear-gradient(150deg, #2878c8, #0a4888); box-shadow: 0 8px 32px rgba(10,80,168,0.4); }

    .label {
      font-size: clamp(1rem, 3.5vw, 1.9rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      letter-spacing: -0.03em;
      text-align: center;
    }

    .sub {
      font-size: clamp(0.55rem, 1.4vw, 0.72rem);
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="hero">
    <img src="/image-1777877237158.jpg" alt="Robert" />
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <p class="welcome-sub">Welcome to</p>
      <h1>Robert's Website</h1>
    </div>
  </div>

  <div class="grid">

    <a class="card music" href="/music">
      <div class="label">Two Bottles<br>Music</div>
      <div class="sub">Stream &amp; Listen</div>
    </a>

    <a class="card photo" href="/photography">
      <div class="label">Photo&shy;graphy</div>
      <div class="sub">Portfolio</div>
    </a>

    <a class="card drug" href="/harmreduction">
      <div class="label">Harm Reduction</div>
      <div class="sub">Resources &amp; Tools</div>
    </a>

    <a class="card web" href="/web-dev">
      <div class="label">Web Dev</div>
      <div class="sub">Projects &amp; Work</div>
    </a>

  </div>

</body>
</html>
