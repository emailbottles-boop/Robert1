<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Bottles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #111008;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .card {
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover { transform: scale(1.02); }

    /* Each card gets its own warm gradient */
    .music { background: linear-gradient(135deg, #f5c842 0%, #f0a500 100%); box-shadow: 0 8px 40px rgba(245,200,66,0.35); }
    .photo { background: linear-gradient(135deg, #ff8c69 0%, #e8553e 100%); box-shadow: 0 8px 40px rgba(255,140,105,0.35); }
    .drug  { background: linear-gradient(135deg, #7de87a 0%, #3cb85a 100%); box-shadow: 0 8px 40px rgba(125,232,122,0.35); }
    .web   { background: linear-gradient(135deg, #70c9f5 0%, #3a8fd4 100%); box-shadow: 0 8px 40px rgba(112,201,245,0.35); }

    .card:hover.music { box-shadow: 0 16px 60px rgba(245,200,66,0.55); }
    .card:hover.photo { box-shadow: 0 16px 60px rgba(255,140,105,0.55); }
    .card:hover.drug  { box-shadow: 0 16px 60px rgba(125,232,122,0.55); }
    .card:hover.web   { box-shadow: 0 16px 60px rgba(112,201,245,0.55); }

    .icon {
      font-size: 3rem;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
      transition: transform 0.2s ease;
    }

    .card:hover .icon { transform: translateY(-6px) scale(1.1); }

    .label {
      font-size: clamp(1.1rem, 2.8vw, 2rem);
      font-weight: 700;
      color: #111;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .sub {
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(0,0,0,0.15);
      color: rgba(0,0,0,0.5);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
    }

    @media (max-width: 560px) {
      body { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); height: auto; min-height: 100vh; overflow: auto; }
      .card { min-height: 160px; }
    }
  </style>
</head>
<body>

  <a class="card music" href="/music">
    <div class="icon">🎵</div>
    <div class="label">Two Bottles<br>Music</div>
    <div class="sub">Stream &amp; Listen</div>
  </a>

  <div class="card photo">
    <span class="badge">Coming Soon</span>
    <div class="icon">📷</div>
    <div class="label">Photography</div>
    <div class="sub">Portfolio</div>
  </div>

  <div class="card drug">
    <span class="badge">Coming Soon</span>
    <div class="icon">🧪</div>
    <div class="label">Drug Testing</div>
    <div class="sub">Harm Reduction</div>
  </div>

  <div class="card web">
    <span class="badge">Coming Soon</span>
    <div class="icon">💻</div>
    <div class="label">Web Dev</div>
    <div class="sub">Projects &amp; Work</div>
  </div>

</body>
</html>
