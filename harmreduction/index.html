<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harm Reduction — Two Bottles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 40px;
      gap: 32px;
    }

    .back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back:hover { color: #fff; }

    .accent { color: #2db86a; }

    h1 {
      font-size: clamp(2.2rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
    }

    .sub {
      font-size: 0.78rem;
      font-weight: 300;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      margin-top: -16px;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }

    .btn {
      background: linear-gradient(135deg, #2db86a, #0e7a3e);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.78rem, 2.5vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      padding: 14px 10px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(14,122,62,0.4);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover, .btn:active {
      transform: scale(0.97);
      box-shadow: 0 3px 12px rgba(14,122,62,0.3);
    }

    /* Carrier Sources spans full width */
    .btn-wide {
      grid-column: 1 / -1;
    }

    @media (max-width: 360px) {
      .btns { grid-template-columns: 1fr; }
      .btn-wide { grid-column: 1; }
    }
  </style>
</head>
<body>
  <a class="back" href="/">&#8592; Back</a>

  <h1><span class="accent">Harm</span> Reduction</h1>
  <p class="sub">Resources &amp; Tools</p>

  <div class="btns">
    <a class="btn" href="/harmreduction/testing-gelatin">Testing Gelatin</a>
    <a class="btn" href="/harmreduction/test-strips">Test Strips</a>
    <a class="btn" href="/harmreduction/cutting-agents">Cutting Agents</a>
    <a class="btn" href="/harmreduction/testing-log">Testing Log</a>
    <a class="btn btn-wide" href="/harmreduction/carrier-sources">Carrier Sources</a>
  </div>
</body>
</html>
